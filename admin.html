<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奶龙美术馆 - 管理面板</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --deep-indigo: #1a1a2e;
            --nailong-yellow: #FFD93D;
            --antique-gold: #C9A227;
            --cream: #F5F5DC;
            --danger: #FF6B6B;
            --success: #51CF66;
            --warning: #FFD43B;
            --info: #74C0FC;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            background: var(--deep-indigo);
            color: var(--cream);
            min-height: 100vh;
        }

        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
        }
        .login-card {
            background: rgba(26, 26, 46, 0.95);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            border: 2px solid var(--antique-gold);
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 0 60px rgba(201, 162, 39, 0.15);
        }
        .login-card h1 {
            color: var(--antique-gold);
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .login-card .subtitle {
            color: rgba(245, 245, 220, 0.6);
            text-align: center;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .login-card .form-group {
            margin-bottom: 1.2rem;
        }
        .login-card .form-group label {
            display: block;
            color: var(--antique-gold);
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .login-card .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--antique-gold);
            border-radius: 12px;
            background: rgba(26, 26, 46, 0.6);
            color: var(--cream);
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .login-card .form-group input:focus {
            outline: none;
            border-color: var(--nailong-yellow);
            box-shadow: 0 0 0 3px rgba(255, 217, 61, 0.15);
        }
        .login-card .form-group input::placeholder {
            color: rgba(245, 245, 220, 0.35);
        }
        #login-error {
            color: var(--danger);
            text-align: center;
            font-size: 0.85rem;
            min-height: 1.2rem;
            margin-bottom: 0.5rem;
        }
        #login-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--nailong-yellow) 0%, var(--antique-gold) 100%);
            border: none;
            border-radius: 12px;
            color: var(--deep-indigo);
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }
        #login-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 217, 61, 0.35);
        }
        #login-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #dashboard {
            display: none;
            min-height: 100vh;
        }
        .dashboard-header {
            background: rgba(26, 26, 46, 0.95);
            border-bottom: 1px solid rgba(201, 162, 39, 0.3);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .dashboard-header h2 {
            color: var(--antique-gold);
            font-size: 1.3rem;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .header-right .admin-email {
            color: var(--cream);
            font-size: 0.85rem;
            opacity: 0.8;
        }
        #btn-logout {
            padding: 0.4rem 1rem;
            background: transparent;
            border: 1px solid var(--danger);
            border-radius: 8px;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        #btn-logout:hover {
            background: rgba(255, 107, 107, 0.15);
        }

        .tab-nav {
            display: flex;
            background: rgba(26, 26, 46, 0.8);
            border-bottom: 1px solid rgba(201, 162, 39, 0.2);
            padding: 0 2rem;
            gap: 0;
        }
        .tab-btn {
            padding: 0.9rem 1.5rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            color: rgba(245, 245, 220, 0.6);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s;
            font-family: inherit;
        }
        .tab-btn:hover {
            color: var(--antique-gold);
        }
        .tab-btn.active {
            color: var(--nailong-yellow);
            border-bottom-color: var(--nailong-yellow);
        }
        .tab-badge {
            display: inline-block;
            background: var(--danger);
            color: #fff;
            border-radius: 10px;
            padding: 0.1rem 0.5rem;
            font-size: 0.75rem;
            margin-left: 0.4rem;
            min-width: 1.2rem;
            text-align: center;
        }
        .tab-content {
            display: none;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tab-content.active {
            display: block;
        }

        #status-message {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 9999;
            transition: opacity 0.3s;
            pointer-events: none;
            opacity: 0;
        }
        #status-message.show {
            opacity: 1;
        }
        #status-message.success {
            background: rgba(81, 207, 102, 0.2);
            border: 1px solid var(--success);
            color: var(--success);
        }
        #status-message.error {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
        }
        #status-message.info {
            background: rgba(116, 192, 252, 0.2);
            border: 1px solid var(--info);
            color: var(--info);
        }

        .section-title {
            color: var(--antique-gold);
            font-size: 1.2rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(201, 162, 39, 0.3);
        }
        .review-toolbar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.4rem 1rem;
            background: transparent;
            border: 1px solid rgba(201, 162, 39, 0.4);
            border-radius: 20px;
            color: var(--cream);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        .filter-btn:hover, .filter-btn.active {
            background: rgba(201, 162, 39, 0.2);
            border-color: var(--antique-gold);
        }
        #review-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .review-card {
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid rgba(201, 162, 39, 0.25);
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            gap: 1.2rem;
            align-items: flex-start;
            transition: border-color 0.3s;
        }
        .review-card:hover {
            border-color: var(--antique-gold);
        }
        .review-card .thumb {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid rgba(201, 162, 39, 0.3);
            flex-shrink: 0;
        }
        .review-card .info {
            flex: 1;
            min-width: 0;
        }
        .review-card .info h4 {
            color: var(--nailong-yellow);
            font-size: 1.05rem;
            margin-bottom: 0.3rem;
        }
        .review-card .info .meta {
            color: rgba(245, 245, 220, 0.6);
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }
        .review-card .info .meta span {
            margin-right: 1rem;
        }
        .review-card .actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-shrink: 0;
        }
        .btn-approve {
            padding: 0.5rem 1.2rem;
            background: var(--success);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-approve:hover {
            background: #40c057;
            transform: scale(1.03);
        }
        .btn-approve:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-reject {
            padding: 0.5rem 1.2rem;
            background: transparent;
            border: 1px solid var(--danger);
            border-radius: 8px;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-reject:hover {
            background: rgba(255, 107, 107, 0.15);
        }
        .btn-reject:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .dup-badge {
            display: inline-block;
            background: rgba(255, 212, 59, 0.2);
            border: 1px solid var(--warning);
            border-radius: 6px;
            padding: 0.2rem 0.6rem;
            font-size: 0.75rem;
            color: var(--warning);
            margin-top: 0.4rem;
        }
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-badge.pending {
            background: rgba(255, 212, 59, 0.2);
            color: var(--warning);
        }
        .status-badge.approved {
            background: rgba(81, 207, 102, 0.2);
            color: var(--success);
        }
        .status-badge.rejected {
            background: rgba(255, 107, 107, 0.2);
            color: var(--danger);
        }

        .manage-toolbar {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            align-items: center;
        }
        #manage-search {
            padding: 0.6rem 1rem;
            border: 1px solid var(--antique-gold);
            border-radius: 10px;
            background: rgba(26, 26, 46, 0.6);
            color: var(--cream);
            font-size: 0.9rem;
            flex: 1;
            min-width: 200px;
            font-family: inherit;
        }
        #manage-search::placeholder {
            color: rgba(245, 245, 220, 0.35);
        }
        #manage-search:focus {
            outline: none;
            border-color: var(--nailong-yellow);
        }
        .btn-refresh {
            padding: 0.6rem 1.2rem;
            background: transparent;
            border: 1px solid var(--antique-gold);
            border-radius: 10px;
            color: var(--antique-gold);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-refresh:hover {
            background: rgba(201, 162, 39, 0.2);
        }
        .painting-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .painting-table th {
            text-align: left;
            padding: 0.8rem;
            color: var(--antique-gold);
            border-bottom: 2px solid rgba(201, 162, 39, 0.3);
            font-weight: 600;
        }
        .painting-table td {
            padding: 0.7rem 0.8rem;
            border-bottom: 1px solid rgba(201, 162, 39, 0.1);
        }
        .painting-table .painting-thumb {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
        }
        .painting-table .btn-delete {
            padding: 0.3rem 0.7rem;
            background: transparent;
            border: 1px solid var(--danger);
            border-radius: 6px;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
            font-family: inherit;
        }
        .painting-table .btn-delete:hover {
            background: rgba(255, 107, 107, 0.15);
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: rgba(245, 245, 220, 0.5);
            font-size: 1rem;
        }

        .add-form {
            max-width: 700px;
        }
        .add-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        @media (max-width: 600px) {
            .add-form .form-row {
                grid-template-columns: 1fr;
            }
        }
        .add-form .form-group {
            margin-bottom: 1rem;
        }
        .add-form .form-group label {
            display: block;
            color: var(--antique-gold);
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .add-form .form-group input,
        .add-form .form-group textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--antique-gold);
            border-radius: 10px;
            background: rgba(26, 26, 46, 0.6);
            color: var(--cream);
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .add-form .form-group input:focus,
        .add-form .form-group textarea:focus {
            outline: none;
            border-color: var(--nailong-yellow);
            box-shadow: 0 0 0 3px rgba(255, 217, 61, 0.1);
        }
        .add-form .form-group input::placeholder,
        .add-form .form-group textarea::placeholder {
            color: rgba(245, 245, 220, 0.35);
        }
        .add-form .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .add-form .form-group .file-input-wrapper {
            position: relative;
        }
        .add-form .form-group .file-input-wrapper input[type="file"] {
            padding: 0.5rem;
            border-style: dashed;
            cursor: pointer;
        }
        .add-form .form-group .preview-img {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
            margin-top: 0.5rem;
            border: 1px solid rgba(201, 162, 39, 0.3);
        }
        #btn-publish {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--nailong-yellow) 0%, var(--antique-gold) 100%);
            border: none;
            border-radius: 12px;
            color: var(--deep-indigo);
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
            font-family: inherit;
        }
        #btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 217, 61, 0.35);
        }
        #btn-publish:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid rgba(201, 162, 39, 0.25);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: border-color 0.3s;
        }
        .stat-card:hover {
            border-color: var(--antique-gold);
        }
        .stat-card .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--nailong-yellow);
            line-height: 1.2;
        }
        .stat-card .stat-label {
            color: rgba(245, 245, 220, 0.7);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(201, 162, 39, 0.3);
            border-top-color: var(--antique-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-content {
            background: var(--deep-indigo);
            padding: 2rem;
            border-radius: 20px;
            border: 2px solid var(--antique-gold);
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .modal-content h3 {
            color: var(--antique-gold);
            margin-bottom: 1rem;
        }
        .modal-content p {
            color: var(--cream);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
        }
        .modal-actions .btn-confirm {
            padding: 0.6rem 1.5rem;
            background: var(--danger);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .modal-actions .btn-cancel {
            padding: 0.6rem 1.5rem;
            background: transparent;
            border: 1px solid var(--antique-gold);
            border-radius: 8px;
            color: var(--antique-gold);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .tab-nav {
                padding: 0 0.5rem;
                overflow-x: auto;
            }
            .tab-btn {
                padding: 0.7rem 0.8rem;
                font-size: 0.8rem;
                white-space: nowrap;
            }
            .tab-content {
                padding: 1rem;
            }
            .review-card {
                flex-direction: column;
            }
            .review-card .actions {
                flex-direction: row;
                width: 100%;
            }
            .painting-table {
                font-size: 0.75rem;
            }
            .painting-table th:nth-child(3),
            .painting-table td:nth-child(3),
            .painting-table th:nth-child(5),
            .painting-table td:nth-child(5) {
                display: none;
            }
            .dashboard-header {
                padding: 0.8rem 1rem;
            }
        }
    
        /* ===== Report Tab ===== */
        .report-summary {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .report-summary .summary-card {
            background: rgba(26, 26, 46, 0.8);
            border: 1px solid rgba(201, 162, 39, 0.25);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            min-width: 140px;
            text-align: center;
        }
        .report-summary .summary-card .val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--nailong-yellow);
        }
        .report-summary .summary-card .lbl {
            font-size: 0.8rem;
            color: rgba(245, 245, 220, 0.6);
            margin-top: 0.2rem;
        }
        .report-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }
        .report-table th {
            text-align: left;
            padding: 0.7rem 0.5rem;
            color: var(--antique-gold);
            border-bottom: 2px solid rgba(201, 162, 39, 0.3);
            font-weight: 600;
            white-space: nowrap;
        }
        .report-table td {
            padding: 0.5rem;
            border-bottom: 1px solid rgba(201, 162, 39, 0.1);
            vertical-align: top;
        }
        .report-table .report-thumb {
            width: 60px;
            height: 60px;
            border-radius: 6px;
            object-fit: cover;
        }
        .report-table input[type="text"],
        .report-table input[type="number"] {
            width: 100%;
            padding: 0.4rem 0.5rem;
            border: 1px solid rgba(201, 162, 39, 0.3);
            border-radius: 6px;
            background: rgba(26, 26, 46, 0.6);
            color: var(--cream);
            font-size: 0.85rem;
            font-family: inherit;
        }
        .report-table input:focus {
            outline: none;
            border-color: var(--nailong-yellow);
        }
        .report-table textarea {
            width: 100%;
            padding: 0.4rem 0.5rem;
            border: 1px solid rgba(201, 162, 39, 0.3);
            border-radius: 6px;
            background: rgba(26, 26, 46, 0.6);
            color: var(--cream);
            font-size: 0.8rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
        }
        .report-table textarea:focus {
            outline: none;
            border-color: var(--nailong-yellow);
        }
        .quality-score {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            min-width: 2.5rem;
            text-align: center;
        }
        .quality-score.excellent {
            background: rgba(81, 207, 102, 0.2);
            color: var(--success);
        }
        .quality-score.good {
            background: rgba(255, 212, 59, 0.2);
            color: var(--warning);
        }
        .quality-score.needs-review {
            background: rgba(255, 146, 43, 0.2);
            color: #ff922b;
        }
        .btn-add-row {
            padding: 0.5rem 1rem;
            background: transparent;
            border: 1px dashed var(--antique-gold);
            border-radius: 8px;
            color: var(--antique-gold);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: inherit;
            margin-bottom: 1rem;
        }
        .btn-add-row:hover {
            background: rgba(201, 162, 39, 0.15);
        }
        .btn-remove-row {
            padding: 0.3rem 0.6rem;
            background: transparent;
            border: 1px solid var(--danger);
            border-radius: 4px;
            color: var(--danger);
            cursor: pointer;
            font-size: 0.75rem;
            font-family: inherit;
        }

<div id="status-message"></div>

<script>
(function() {
    'use strict';

    var ADMIN_EMAILS = [
        '19516778198@163.com'
    ];

    var SUPABASE_URL = 'https://datenwietosgfprmxcua.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhdGVud2lldG9zZ2Zwcm14Y3VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxODQ1MzgsImV4cCI6MjA5NDc2MDUzOH0.07g82Otjv8SIxN_YIc3PYm0GLlF9wYwDQyJBkhUD0ME';

    var supabase = null;
    var currentUser = null;
    var currentFilter = 'all';
    var allSubmissions = [];
    var allPaintings = [];

    function initSupabase() {
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('[Admin] Supabase init ok');
        } catch (err) {
            console.error('[Admin] Supabase init fail:', err);
            showStatus('数据库连接失败', 'error');
        }
    }

    function showStatus(msg, type) {
        var el = document.getElementById('status-message');
        el.textContent = msg;
        el.className = type + ' show';
        clearTimeout(el._timeout);
        el._timeout = setTimeout(function() {
            el.classList.remove('show');
        }, 3000);
    }

    function handleLogin() {
        var email = document.getElementById('login-email').value.trim();
        var password = document.getElementById('login-password').value;
        var errorEl = document.getElementById('login-error');
        var btn = document.getElementById('login-submit');

        if (!email || !password) {
            errorEl.textContent = '请填写邮箱和密码';
            return;
        }

        errorEl.textContent = '';
        btn.disabled = true;
        btn.textContent = '登录中...';

        var timeoutId = setTimeout(function() {
            btn.disabled = false;
            btn.textContent = '登 录';
            errorEl.textContent = '登录超时，请检查网络后重试';
        }, 15000);

        supabase.auth.signInWithPassword({ email: email, password: password })
            .then(function(result) {
                clearTimeout(timeoutId);
                btn.disabled = false;
                btn.textContent = '登 录';

                if (result.error) {
                    var msg = result.error.message || '';
                    if (msg.indexOf('Invalid login credentials') !== -1) {
                        errorEl.textContent = '邮箱或密码错误';
                    } else if (msg.indexOf('Email not confirmed') !== -1) {
                        errorEl.textContent = '邮箱尚未验证';
                    } else if (msg.indexOf('Too many requests') !== -1) {
                        errorEl.textContent = '请求过于频繁，请稍后再试';
                    } else {
                        errorEl.textContent = '登录失败: ' + msg;
                    }
                    return;
                }

                if (result.data && result.data.user) {
                    var userEmail = result.data.user.email;
                    if (ADMIN_EMAILS.length > 0 && ADMIN_EMAILS.indexOf(userEmail) === -1) {
                        errorEl.textContent = '该账号无管理员权限';
                        supabase.auth.signOut();
                        return;
                    }

                    currentUser = result.data.user;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    document.getElementById('admin-email-display').textContent = userEmail;
                    initDashboard();
                }
            })
            .catch(function(err) {
                clearTimeout(timeoutId);
                btn.disabled = false;
                btn.textContent = '登 录';
                console.error('[Admin] Login error:', err);
                if (err.message && err.message.indexOf('fetch') !== -1) {
                    errorEl.textContent = '网络错误，请检查网络连接';
                } else {
                    errorEl.textContent = '登录失败: ' + (err.message || '请稍后再试');
                }
            });
    }

    function handleLogout() {
        supabase.auth.signOut().then(function() {
            currentUser = null;
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('login-error').textContent = '';
        });
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.classList.remove('active');
        });
        document.querySelectorAll('.tab-content').forEach(function(content) {
            content.classList.remove('active');
        });

        var tabBtn = document.getElementById('tab-' + tabName);
        var tabContent = document.getElementById('content-' + tabName);
        if (tabBtn) tabBtn.classList.add('active');
        if (tabContent) tabContent.classList.add('active');

        if (tabName === 'review') loadSubmissions();
        if (tabName === 'manage') loadPaintings();
        if (tabName === 'stats') loadStats();
        if (tabName === 'report') updateReportSummary();
    }

    function initDashboard() {
        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                switchTab(this.getAttribute('data-tab'));
            });
        });

        document.getElementById('btn-logout').addEventListener('click', handleLogout);

        document.getElementById('review-list').addEventListener('click', function(e) {
            var btn = e.target.closest('.btn-approve, .btn-reject');
            if (!btn) return;
            var id = btn.getAttribute('data-id');
            if (!id) return;
            if (btn.classList.contains('btn-approve')) {
                window._adminApprove(id);
            } else if (btn.classList.contains('btn-reject')) {
                window._adminReject(id);
            }
        });

        document.querySelectorAll('#content-review .filter-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#content-review .filter-btn').forEach(function(b) {
                    b.classList.remove('active');
                });
                this.classList.add('active');
                currentFilter = this.getAttribute('data-filter');
                renderReviewList();
            });
        });

        var searchTimer = null;
        document.getElementById('manage-search').addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderManageTable, 300);
        });

        document.getElementById('btn-refresh-manage').addEventListener('click', function() {
            loadPaintings();
        });

        document.getElementById('painting-image').addEventListener('input', function() {
            var url = this.value.trim();
            var preview = document.getElementById('painting-image-preview');
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        });

        document.getElementById('original-painting-upload').addEventListener('change', function() {
            var file = this.files[0];
            var preview = document.getElementById('original-painting-preview');
            if (file) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
            }
        });

        document.getElementById('btn-publish').addEventListener('click', handlePublish);

        document.getElementById('btn-add-report-row').addEventListener('click', addReportRow);
        document.getElementById('btn-batch-publish').addEventListener('click', batchPublish);

        document.getElementById('confirm-cancel').addEventListener('click', closeConfirmModal);
        document.getElementById('confirm-ok').addEventListener('click', function() {
            if (window._confirmCallback) {
                window._confirmCallback();
                window._confirmCallback = null;
            }
            closeConfirmModal();
        });

        loadSubmissions();
    }

    function showConfirm(title, message, callback) {
        document.getElementById('confirm-title').textContent = title;
        document.getElementById('confirm-message').textContent = message;
        document.getElementById('confirm-modal').classList.add('show');
        window._confirmCallback = callback;
    }

    function closeConfirmModal() {
        document.getElementById('confirm-modal').classList.remove('show');
    }

    function loadSubmissions() {
        var list = document.getElementById('review-list');
        list.innerHTML = '<div class="empty-state"><span class="loading-spinner"></span>加载中...</div>';

        supabase.from('submissions')
            .select('*')
            .order('created_at', { ascending: false })
            .then(function(result) {
                if (result.error) {
                    console.error('[Admin] Load submissions error:', result.error);
                    list.innerHTML = '<div class="empty-state">加载失败: ' + result.error.message + '</div>';
                    return;
                }
                allSubmissions = result.data || [];
                renderReviewList();
            });
    }

    function renderReviewList() {
        var list = document.getElementById('review-list');
        var filtered = allSubmissions;

        if (currentFilter !== 'all') {
            filtered = allSubmissions.filter(function(s) {
                return s.status === currentFilter;
            });
        }

        var pendingCount = allSubmissions.filter(function(s) { return s.status === 'pending'; }).length;
        var badge = document.getElementById('review-badge');
        if (pendingCount > 0) {
            badge.textContent = pendingCount;
            badge.style.display = 'inline-block';
        } else {
            badge.style.display = 'none';
        }

        if (filtered.length === 0) {
            list.innerHTML = '<div class="empty-state">暂无投稿</div>';
            return;
        }

        list.innerHTML = filtered.map(function(sub) {
            var statusLabel = '';
            var statusClass = '';
            if (sub.status === 'pending') {
                statusLabel = '待审核';
                statusClass = 'pending';
            } else if (sub.status === 'approved') {
                statusLabel = '已通过';
                statusClass = 'approved';
            } else if (sub.status === 'rejected') {
                statusLabel = '已拒绝';
                statusClass = 'rejected';
            }

            var actionsHtml = '';
            if (sub.status === 'pending') {
                actionsHtml = '<button class="btn-approve" data-id="' + sub.id + '">通过</button>' +
                              '<button class="btn-reject" data-id="' + sub.id + '">拒绝</button>';
            }

            var createdAt = sub.created_at ? new Date(sub.created_at).toLocaleString('zh-CN') : '未知';

            return '<div class="review-card">' +
                '<img class="thumb" src="' + escapeHtml(sub.image_url) + '" alt="' + escapeHtml(sub.original_title || '') + '" onerror="this.style.display=\'none\'">' +
                '<div class="info">' +
                    '<h4>' + escapeHtml(sub.original_title || '未命名') + '</h4>' +
                    '<div class="meta">' +
                        '<span>艺术家: ' + escapeHtml(sub.original_artist || '未知') + '</span>' +
                        '<span class="status-badge ' + statusClass + '">' + statusLabel + '</span>' +
                    '</div>' +
                    '<div class="meta">' +
                        '<span>投稿人: ' + escapeHtml(sub.submitter_name || '匿名') + '</span>' +
                        '<span>' + createdAt + '</span>' +
                    '</div>' +
                '</div>' +
                '<div class="actions">' + actionsHtml + '</div>' +
            '</div>';
        }).join('');
    }

    window._adminApprove = function(id) {
        var sub = allSubmissions.find(function(s) { return String(s.id) == String(id); });
        if (!sub) { console.log('[Admin] Approve: not found for id=' + id); return; }

        document.getElementById('painting-image').value = sub.image_url || '';
        document.getElementById('painting-title').value = sub.original_title || '';
        document.getElementById('painting-artist').value = sub.original_artist || '';
        document.getElementById('painting-year').value = '';
        document.getElementById('option-a').value = '';
        document.getElementById('option-b').value = '';
        document.getElementById('option-c').value = '';
        document.getElementById('option-d').value = '';
        document.getElementById('painting-explanation').value = '';
        document.getElementById('original-painting-url').value = '';
        document.getElementById('original-painting-upload').value = '';

        var preview = document.getElementById('painting-image-preview');
        if (sub.image_url) {
            preview.src = sub.image_url;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }
        document.getElementById('original-painting-preview').style.display = 'none';

        window._currentApproveId = id;
        switchTab('add');
        showStatus('已加载投稿信息，请填写剩余字段后发布', 'info');
    };

    window._adminReject = function(id) {
        showConfirm('确认拒绝', '确定要拒绝此投稿吗？', function() {
            supabase.from('submissions')
                .update({ status: 'rejected' })
                .eq('id', id)
                .then(function(result) {
                    if (result.error) {
                        showStatus('操作失败: ' + result.error.message, 'error');
                        return;
                    }
                    var sub = allSubmissions.find(function(s) { return String(s.id) == String(id); });
                    if (sub) sub.status = 'rejected';
                    renderReviewList();
                    showStatus('已拒绝该投稿', 'success');
                });
        });
    };

    function loadPaintings() {
        var tbody = document.getElementById('manage-table-body');
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><span class="loading-spinner"></span>加载中...</td></tr>';

        supabase.from('paintings')
            .select('*')
            .order('created_at', { ascending: false })
            .then(function(result) {
                if (result.error) {
                    console.error('[Admin] Load paintings error:', result.error);
                    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">加载失败: ' + result.error.message + '</td></tr>';
                    return;
                }
                allPaintings = result.data || [];
                renderManageTable();
            });
    }

    function renderManageTable() {
        var tbody = document.getElementById('manage-table-body');
        var searchTerm = document.getElementById('manage-search').value.trim().toLowerCase();

        var filtered = allPaintings;
        if (searchTerm) {
            filtered = allPaintings.filter(function(p) {
                return (p.title && p.title.toLowerCase().indexOf(searchTerm) !== -1) ||
                       (p.artist && p.artist.toLowerCase().indexOf(searchTerm) !== -1);
            });
        }

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty-state">暂无题目</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(function(p) {
            var statusLabel = p.status === 'active' ? '启用' : '停用';
            var statusClass = p.status === 'active' ? 'approved' : 'rejected';

            return '<tr>' +
                '<td><img class="painting-thumb" src="' + escapeHtml(p.image) + '" alt="" onerror="this.style.display=\'none\'"></td>' +
                '<td>' + escapeHtml(p.title || '-') + '</td>' +
                '<td>' + escapeHtml(p.artist || '-') + '</td>' +
                '<td>' + escapeHtml(p.year || '-') + '</td>' +
                '<td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>' +
                '<td><button class="btn-delete" onclick="window._adminDeletePainting(' + p.id + ')">删除</button></td>' +
            '</tr>';
        }).join('');
    }

    window._adminDeletePainting = function(id) {
        showConfirm('确认删除', '确定要删除这道题目吗？', function() {
            supabase.from('paintings')
                .delete()
                .eq('id', id)
                .then(function(result) {
                    if (result.error) {
                        showStatus('删除失败: ' + result.error.message, 'error');
                        return;
                    }
                    allPaintings = allPaintings.filter(function(p) { return p.id !== id; });
                    renderManageTable();
                    showStatus('题目已删除', 'success');
                });
        });
    };

    function handlePublish() {
        var title = document.getElementById('painting-title').value.trim();
        var artist = document.getElementById('painting-artist').value.trim();
        var image = document.getElementById('painting-image').value.trim();
        var year = document.getElementById('painting-year').value.trim();
        var optA = document.getElementById('option-a').value.trim();
        var optB = document.getElementById('option-b').value.trim();
        var optC = document.getElementById('option-c').value.trim();
        var optD = document.getElementById('option-d').value.trim();
        var explanation = document.getElementById('painting-explanation').value.trim();
        var originalPaintingUrl = document.getElementById('original-painting-url').value.trim();

        if (!title || !artist || !image) {
            showStatus('请填写题目图片URL、原画名称和艺术家', 'error');
            return;
        }
        if (!optA || !optB || !optC || !optD) {
            showStatus('请填写全部四个选项', 'error');
            return;
        }
        if (!explanation) {
            showStatus('请填写讲解文字', 'error');
            return;
        }

        var btn = document.getElementById('btn-publish');
        btn.disabled = true;
        btn.textContent = '发布中...';

        var fileInput = document.getElementById('original-painting-upload');
        var file = fileInput.files[0];

        function doInsert(finalOriginalUrl) {
            var options = [optA, optB, optC, optD];
            for (var i = options.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = options[i];
                options[i] = options[j];
                options[j] = temp;
            }

            var paintingData = {
                image: image,
                title: title,
                artist: artist,
                year: year || null,
                options: options,
                explanation: explanation,
                status: 'active',
                original_painting: finalOriginalUrl || null
            };

            supabase.from('paintings')
                .insert(paintingData)
                .then(function(result) {
                    btn.disabled = false;
                    btn.textContent = '发布题目';

                    if (result.error) {
                        showStatus('发布失败: ' + result.error.message, 'error');
                        return;
                    }

                    if (window._currentApproveId) {
                        supabase.from('submissions')
                            .update({ status: 'approved' })
                            .eq('id', window._currentApproveId)
                            .then(function() {
                                var sub = allSubmissions.find(function(s) { return String(s.id) == String(window._currentApproveId); });
                                if (sub) sub.status = 'approved';
                                window._currentApproveId = null;
                            });
                    }

                    document.getElementById('painting-image').value = '';
                    document.getElementById('painting-title').value = '';
                    document.getElementById('painting-artist').value = '';
                    document.getElementById('painting-year').value = '';
                    document.getElementById('option-a').value = '';
                    document.getElementById('option-b').value = '';
                    document.getElementById('option-c').value = '';
                    document.getElementById('option-d').value = '';
                    document.getElementById('painting-explanation').value = '';
                    document.getElementById('original-painting-url').value = '';
                    document.getElementById('original-painting-upload').value = '';
                    document.getElementById('painting-image-preview').style.display = 'none';
                    document.getElementById('original-painting-preview').style.display = 'none';

                    showStatus('题目发布成功！', 'success');
                });
        }

        if (file) {
            var fileExt = file.name.split('.').pop();
            var fileName = 'original_' + Date.now() + '.' + fileExt;

            supabase.storage.from('paintings')
                .upload('original/' + fileName, file)
                .then(function(uploadResult) {
                    if (uploadResult.error) {
                        console.error('[Admin] Upload original error:', uploadResult.error);
                        doInsert('');
                        return;
                    }

                    var publicUrl = supabase.storage.from('paintings')
                        .getPublicUrl('original/' + fileName);
                    var finalUrl = publicUrl.data ? publicUrl.data.publicUrl : '';
                    document.getElementById('original-painting-url').value = finalUrl;
                    doInsert(finalUrl);
                });
        } else {
            doInsert(originalPaintingUrl);
        }
    }

    function loadStats() {
        Promise.all([
            supabase.from('paintings').select('id', { count: 'exact', head: true }),
            supabase.from('submissions').select('id', { count: 'exact', head: true }),
            supabase.from('submissions').select('id', { count: 'exact', head: true }).eq('status', 'pending')
        ]).then(function(results) {
            document.getElementById('stat-paintings').textContent = (results[0].count !== null) ? results[0].count : '-';
            document.getElementById('stat-submissions').textContent = (results[1].count !== null) ? results[1].count : '-';
            document.getElementById('stat-pending').textContent = (results[2].count !== null) ? results[2].count : '0';

            supabase.from('profiles').select('id', { count: 'exact', head: true })
                .then(function(r) {
                    document.getElementById('stat-users').textContent = (r.count !== null) ? r.count : '-';
                })
                .catch(function() {
                    document.getElementById('stat-users').textContent = '-';
                });
        }).catch(function(err) {
            console.error('[Admin] Stats error:', err);
            document.getElementById('stat-paintings').textContent = '!';
            document.getElementById('stat-submissions').textContent = '!';
            document.getElementById('stat-pending').textContent = '!';
            document.getElementById('stat-users').textContent = '!';
        });
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function initLogin() {
        document.getElementById('login-submit').addEventListener('click', handleLogin);
        document.getElementById('login-password').addEventListener('keydown', function(e) {
            if (e.keyCode === 13) handleLogin();
        });
    }

    var reportRowCounter = 0;

    function addReportRow() {
        reportRowCounter++;
        var rowId = 'report-row-' + reportRowCounter;
        var tbody = document.getElementById('report-table-body');

        var emptyRow = tbody.querySelector('.empty-state');
        if (emptyRow) {
            var parentRow = emptyRow.parentNode;
            if (parentRow) parentRow.remove();
        }

        var row = document.createElement('tr');
        row.className = 'report-row';
        row.setAttribute('data-row', reportRowCounter);
        row.id = rowId;
        row.innerHTML = '<td>' +
            '<input type="text" name="painting-image" placeholder="图片URL" oninput="window._reportPreviewImage(this, ' + reportRowCounter + ')">' +
            '<img class="report-thumb" id="report-thumb-' + reportRowCounter + '" style="display:none;margin-top:4px" src="">' +
            '</td>' +
            '<td><input type="text" name="painting-title" placeholder="题目名称"></td>' +
            '<td><input type="text" name="painting-artist" placeholder="艺术家"></td>' +
            '<td><input type="text" name="painting-year" placeholder="年代"></td>' +
            '<td><input type="text" name="option-a" placeholder="选项A"></td>' +
            '<td><input type="text" name="option-b" placeholder="选项B"></td>' +
            '<td><input type="text" name="option-c" placeholder="选项C"></td>' +
            '<td><input type="text" name="option-d" placeholder="选项D"></td>' +
            '<td><textarea name="painting-explanation" placeholder="500-800字讲解" rows="4"></textarea></td>' +
            '<td><input type="text" name="original-painting-url" placeholder="原画URL"></td>' +
            '<td><input type="number" name="quality-score" placeholder="0-100" min="0" max="100" style="width:60px" oninput="window._reportUpdateScore()"></td>' +
            '<td><button class="btn-remove-row" onclick="window._reportRemoveRow(' + reportRowCounter + ')">X</button>' +
            '<input type="hidden" name="submission-id" value=""></td>';

        tbody.appendChild(row);
        updateReportSummary();
    }

    window._reportPreviewImage = function(input, rowNum) {
        var url = input.value.trim();
        var img = document.getElementById('report-thumb-' + rowNum);
        if (url) {
            img.src = url;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }
    };

    window._reportUpdateScore = function() {
        updateReportSummary();
    };

    window._reportRemoveRow = function(rowNum) {
        var row = document.getElementById('report-row-' + rowNum);
        if (row) {
            row.parentNode.removeChild(row);
        }
        updateReportSummary();
    };

    function updateReportSummary() {
        var rows = document.querySelectorAll('#report-table-body .report-row');
        var total = rows.length;
        var sumScore = 0;
        var scoreCount = 0;
        var excellent = 0;
        var good = 0;

        rows.forEach(function(row) {
            var scoreInput = row.querySelector('[name="quality-score"]');
            var score = parseInt(scoreInput.value, 10);
            if (!isNaN(score)) {
                sumScore += score;
                scoreCount++;
                if (score >= 90) excellent++;
                else if (score >= 70) good++;
            }
        });

        var totalEl = document.getElementById('report-total');
        var avgEl = document.getElementById('report-avg-score');
        var excEl = document.getElementById('report-excellent');
        var goodEl = document.getElementById('report-good');
        if (totalEl) totalEl.textContent = total;
        if (avgEl) avgEl.textContent = scoreCount > 0 ? Math.round(sumScore / scoreCount) : '-';
        if (excEl) excEl.textContent = excellent;
        if (goodEl) goodEl.textContent = good;

        if (total === 0) {
            var tbody = document.getElementById('report-table-body');
            if (tbody && tbody.querySelectorAll('.report-row').length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" class="empty-state">点击"+ 添加新行"开始</td></tr>';
            }
        }
    }

    function collectReportData() {
        var rows = document.querySelectorAll('#report-table-body .report-row');
        var data = [];
        rows.forEach(function(row) {
            var getVal = function(name) {
                var el = row.querySelector('[name="' + name + '"]');
                return el ? el.value.trim() : '';
            };
            var score = parseInt(getVal('quality-score'), 10);
            var item = {
                image: getVal('painting-image'),
                title: getVal('painting-title'),
                artist: getVal('painting-artist'),
                year: getVal('painting-year'),
                optionA: getVal('option-a'),
                optionB: getVal('option-b'),
                optionC: getVal('option-c'),
                optionD: getVal('option-d'),
                explanation: getVal('painting-explanation'),
                originalPaintingUrl: getVal('original-painting-url'),
                qualityScore: isNaN(score) ? 0 : score,
                submissionId: getVal('submission-id')
            };
            data.push(item);
        });
        return data;
    }

    function batchPublish() {
        var items = collectReportData();
        if (items.length === 0) {
            showStatus('审核报告中没有待发布题目', 'error');
            return;
        }

        for (var i = 0; i < items.length; i++) {
            var it = items[i];
            if (!it.image || !it.title || !it.artist || !it.optionA || !it.optionB || !it.optionC || !it.optionD || !it.explanation) {
                showStatus('第' + (i + 1) + '行有必填字段为空，请补充后重试', 'error');
                return;
            }
        }

        showConfirm('确认批量发布', '共 ' + items.length + ' 道题目待发布，确认发布？', function() {
            executeBatchPublish(items, 0);
        });
    }

    function executeBatchPublish(items, index) {
        var btn = document.getElementById('btn-batch-publish');
        var progress = document.getElementById('batch-publish-progress');
        var bar = progress.querySelector('.bar');
        var pct = progress.querySelector('.pct');

        btn.disabled = true;
        progress.style.display = 'block';

        function updateProgress(done, total) {
            var w = Math.round((done / total) * 100);
            bar.style.width = w + '%';
            pct.textContent = done + '/' + total;
        }

        function publishNext() {
            if (index >= items.length) {
                btn.disabled = false;
                updateProgress(items.length, items.length);
                showStatus('批量发布完成！共发布 ' + items.length + ' 道题目', 'success');
                document.getElementById('report-table-body').innerHTML = '<tr><td colspan="12" class="empty-state">点击"+ 添加新行"开始</td></tr>';
                return;
            }

            updateProgress(index, items.length);
            var it = items[index];

            var options = [it.optionA, it.optionB, it.optionC, it.optionD];
            for (var i = options.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = options[i];
                options[i] = options[j];
                options[j] = temp;
            }

            var paintingData = {
                image: it.image,
                title: it.title,
                artist: it.artist,
                year: it.year || null,
                options: options,
                explanation: it.explanation,
                status: 'active',
                original_painting: it.originalPaintingUrl || null
            };

            supabase.from('paintings')
                .insert(paintingData)
                .then(function(result) {
                    if (result.error) {
                        showStatus('发布第' + (index + 1) + '题失败: ' + result.error.message, 'error');
                        btn.disabled = false;
                        return;
                    }

                    if (it.submissionId) {
                        supabase.from('submissions')
                            .update({ status: 'approved' })
                            .eq('id', it.submissionId)
                            .then(function() {
                                var sub = allSubmissions.find(function(s) { return String(s.id) == String(it.submissionId); });
                                if (sub) sub.status = 'approved';
                            });
                    }

                    index++;
                    publishNext();
                })
                .catch(function(err) {
                    showStatus('发布第' + (index + 1) + '题网络错误', 'error');
                    btn.disabled = false;
                });
        }

        updateProgress(0, items.length);
        publishNext();
    }

    function restoreSession() {
        function restoreSession() {
        supabase.auth.getSession().then(function(result) {
            if (result.data && result.data.session) {
                var user = result.data.session.user;
                if (ADMIN_EMAILS.length === 0 || ADMIN_EMAILS.indexOf(user.email) !== -1) {
                    currentUser = user;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    document.getElementById('admin-email-display').textContent = user.email;
                    initDashboard();
                }
            }
        }).catch(function(err) {
            console.error('[Admin] Session restore error:', err);
        });
    }

    initSupabase();
    initLogin();
    restoreSession();

})();
</script>
